<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESCALA ONE · Maqueta de navegación v4</title>
<style>
:root{
  --orange:#DB4426; --ink:#000; --g700:#343434;
  --g25:#FBFBFB; --g100:#F2F2F2; --g200:#E5E5E5; --g300:#D9D9D9; --g500:#8A8A8A; --label:#6B6B6B;
  --blue:#043A43; --teal:#79A79C; --olive:#78825B;
  --pos:#1F7A4D; --posb:#E8F1EC; --warn:#B07000; --warnb:#FBF1DD; --neg:#B5331C; --negb:#F7E5E1; --info:#1F4F8F; --infob:#E5EDF7;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:var(--g25);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;font-size:14px}
button{font:inherit;color:inherit}
a{color:inherit}
:focus:not(:focus-visible){outline:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:-2px}
.ic{flex-shrink:0;display:block}
.muted{color:var(--label)}
.sm{font-size:12px}
.eyebrow{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--label)}

/* ---------- Barra de la maqueta ---------- */
.tb{height:48px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--g200)}
.tb-brand{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap}
.tb-brand small{font-weight:400;color:var(--label)}
.tb .spacer{flex:1}
.seg{display:inline-flex;border:1px solid var(--g200);border-radius:6px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;font-size:13px;padding:0 12px;height:30px;cursor:pointer;color:var(--g700);display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button + button{border-left:1px solid var(--g200)}
.seg button.on{background:var(--g100);color:#000;font-weight:600}
.tgl{display:flex;align-items:center;gap:8px;border:0;background:none;cursor:pointer;font-size:13px;height:30px;padding:0 6px;border-radius:6px}
.tgl .sw{width:28px;height:16px;border-radius:8px;background:var(--g300);position:relative;transition:background .15s}
.tgl .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.tgl.on .sw{background:#000}
.tgl.on .sw::after{left:14px}

/* ---------- Escenario ---------- */
.stage{flex:1;display:flex;min-height:0;position:relative}
#app{flex:1;display:flex;min-width:0;min-height:0}
#notes{width:340px;flex-shrink:0;border-left:1px solid var(--g200);background:#fff;overflow-y:auto}
body.notes-off #notes{display:none}
body.notes-off .mk{display:none}

/* Marcadores numerados */
.mk{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:#000;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;z-index:5;font-variant-numeric:tabular-nums;pointer-events:none;box-shadow:0 0 0 2px #fff;flex-shrink:0;letter-spacing:0;text-transform:none}
.mk.inl{position:static;margin-left:8px;box-shadow:none}
.mk.tr{top:8px;right:10px}
.mk.st{position:static;box-shadow:none;margin-top:1px}

/* ================= PROPUESTA ================= */
.sb{width:288px;flex-shrink:0;background:#fff;border-right:1px solid var(--g200);display:flex;flex-direction:column;min-height:0;transition:width .15s}
.sb-logo{height:56px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--g200)}
.wm{display:flex;align-items:baseline;white-space:nowrap}
.wm b{font-size:15px;letter-spacing:.14em;font-weight:700}
.wm i{font-style:normal;font-size:10.5px;letter-spacing:.24em;color:var(--orange);margin-left:6px;font-weight:500}
.sb-top{padding:12px 12px 10px;border-bottom:1px solid var(--g200);display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.sb-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--g200);border-radius:6px;background:var(--g25);color:var(--label);font-size:13px;cursor:pointer;text-align:left;width:100%}
.sb-search:hover{border-color:var(--g300)}
.sb-search kbd{margin-left:auto;font-family:var(--font);font-size:10.5px;border:1px solid var(--g300);border-radius:4px;padding:1px 5px;background:#fff;color:var(--label)}
.nav-a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:4px;color:#000;text-decoration:none;font-size:13.5px;position:relative}
.nav-a .ic{color:var(--g700)}
.nav-a:hover{background:#F7F7F7}
.nav-a.active{background:var(--g100);font-weight:600}
.nav-a.active::before,.it.active::before,.sb.rail .g.has-active .g-h::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;background:var(--orange);border-radius:2px}
.sb-scroll{flex:1;overflow-y:auto;padding:6px 12px 16px;scrollbar-width:thin;min-height:0}
.g-h{display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border:0;background:none;font-size:13.5px;font-weight:600;color:#000;border-radius:4px;cursor:pointer;position:relative;text-align:left;margin-top:2px}
.g-h:hover{background:#F7F7F7}
.g-h .ic{color:var(--g700)}
.g-h .cnt-g{font-size:12px;font-weight:400;color:var(--label);margin-left:2px;font-variant-numeric:tabular-nums}
.g-h .chev{margin-left:auto;color:var(--label);display:flex}
.g-h .dot{width:6px;height:6px;border-radius:50%;background:var(--orange);margin-left:6px}
.g-items{padding:2px 0 8px}
.sub{font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--label);padding:10px 8px 4px 37px}
.it{display:flex;align-items:center;border-radius:4px;position:relative}
.it a{flex:1;min-width:0;display:block;padding:0 10px 0 37px;height:32px;line-height:32px;font-size:13.5px;color:#1A1A1A;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it:hover{background:#F7F7F7}
.it.active{background:var(--g100)}
.it.active a{font-weight:600;color:#000}
.sb-divider{margin:14px 0 2px;padding:14px 10px 4px;border-top:1px solid var(--g200);display:flex;align-items:center;gap:8px}
.sb-divider small{font-size:11px;color:var(--label)}
.sb-foot{border-top:1px solid var(--g200);padding:8px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sb-foot button{display:flex;align-items:center;gap:8px;border:0;background:none;font-size:12.5px;color:var(--label);cursor:pointer;height:30px;padding:0 8px;border-radius:4px}
.sb-foot button:hover{background:var(--g100);color:#000}
.sb-foot .ver{font-size:11px;color:var(--g500)}
/* Modo contraído */
.sb.rail{width:64px}
.sb.rail .lbl,.sb.rail .g-items,.sb.rail .sb-divider span,.sb.rail .sb-divider small,.sb.rail .mk{display:none}
.sb.rail .sb-logo{padding:0;justify-content:center}
.sb.rail .g-h,.sb.rail .nav-a,.sb.rail .sb-search{justify-content:center;padding:0}
.sb.rail .sb-scroll{padding:6px 10px}
.sb.rail .sb-divider{padding:0;margin:10px 0}
.sb.rail .sb-foot{justify-content:center;padding:8px 0}
.sb.rail .g.has-active .g-h{background:var(--g100)}

.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
.hd{height:56px;flex-shrink:0;background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px}
.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--label);white-space:nowrap;overflow:hidden}
.crumb .ic{color:var(--g500)}
.crumb b{color:#000;font-weight:600}
.hd-r{display:flex;align-items:center;gap:4px;position:relative}
.icb{width:34px;height:34px;border:0;border-radius:6px;background:none;display:flex;align-items:center;justify-content:center;color:var(--g700);position:relative;cursor:pointer}
.icb:hover{background:var(--g100)}
.badge{position:absolute;top:3px;right:0;min-width:17px;height:16px;padding:0 4px;border-radius:8px;background:#000;color:#fff;font-size:9.5px;font-weight:700;line-height:16px;text-align:center}
.avbtn{display:flex;align-items:center;gap:4px;border:0;background:none;cursor:pointer;padding:3px 4px 3px 3px;border-radius:20px;margin-left:6px;color:var(--label)}
.avbtn:hover{background:var(--g100)}
.av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}
.av.lg{width:36px;height:36px;font-size:12.5px}
.menu{position:absolute;right:0;top:44px;width:270px;background:#fff;border:1px solid var(--g200);border-radius:8px;z-index:30;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.menu-h{display:flex;gap:10px;align-items:center;padding:8px 8px 12px;border-bottom:1px solid var(--g200);margin-bottom:4px}
.menu-h b{display:block;font-size:13px}
.menu-h small{font-size:12px;color:var(--label)}
.mi{display:flex;align-items:center;gap:10px;height:34px;padding:0 8px;border-radius:4px;font-size:13px;text-decoration:none;color:#000}
.mi:hover{background:var(--g100)}
.mi .ic{color:var(--g700)}
.menu-f{border-top:1px solid var(--g200);margin-top:4px;padding:8px 8px 4px;font-size:11px;color:var(--g500)}

.content{flex:1;overflow-y:auto;background:var(--g25);min-height:0}
.page{max-width:1120px;padding:28px 32px 56px}
.page-h h1{font-size:24px;font-weight:600;letter-spacing:-.01em;margin:4px 0 4px}
.page-h p{margin:0;font-size:13px}
.blk{margin-top:28px}
.blk-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cnt{font-weight:600;font-size:11px;background:#000;color:#fff;border-radius:9px;padding:0 6px;line-height:18px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.seg button:not(.on) .cnt{background:var(--g700)}
.strip{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13.5px}
.btn-sec{border:1px solid var(--g300);background:#fff;border-radius:6px;height:30px;padding:0 12px;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-sec:hover{border-color:#000}
.btn-primary{background:var(--orange);color:#fff;border:0;border-radius:6px;height:30px;padding:0 14px;font-size:13px;font-weight:600;cursor:pointer}
.chips{display:flex;gap:6px;margin-left:auto;align-items:center;flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border:1px solid var(--g200);border-radius:6px;background:#fff;font-size:12.5px;cursor:pointer;color:var(--g700);white-space:nowrap}
.chip:hover{border-color:var(--g500)}
.chip.on{border-color:#000;background:#000;color:#fff;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;position:relative}
.card{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:16px 18px}
.card-h{display:flex;align-items:center;gap:10px}
.card-h .cic{width:30px;height:30px;border:1px solid var(--g200);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--g700)}
.card-h .t{font-weight:600;font-size:14px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.pos{color:var(--pos);background:var(--posb)}
.pill.warn{color:var(--warn);background:var(--warnb)}
.pill.neg{color:var(--neg);background:var(--negb)}
.num{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:16px;line-height:1;display:flex;align-items:baseline}
.num small{font-size:12.5px;font-weight:400;color:var(--label);margin-left:8px}
.bar{height:4px;background:var(--g100);border-radius:2px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal)}
.old{font-size:12px;color:var(--label);margin-top:6px;font-variant-numeric:tabular-nums}
.meta{font-size:12px;color:var(--label);margin-top:8px;font-variant-numeric:tabular-nums}
.disc{display:flex;align-items:center;gap:8px;width:100%;background:#fff;border:1px solid var(--g200);border-radius:8px;height:46px;padding:0 16px;font-size:14px;font-weight:600;cursor:pointer;text-align:left}
.disc:hover{border-color:var(--g300)}
.ph{margin-top:16px;background:#fff;border:1px solid var(--g200);border-radius:8px;min-height:240px;display:flex;align-items:center;justify-content:center;color:var(--label);font-size:13px;padding:24px;text-align:center}
.callout{display:flex;gap:12px;align-items:baseline;background:#fff;border:1px solid var(--g200);border-left:2px solid #000;padding:10px 14px;border-radius:0 6px 6px 0;font-size:13px;margin-top:16px}
.callout .eyebrow{flex-shrink:0}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--g200);margin-top:22px;flex-wrap:wrap}
.tabs button{border:0;background:none;font-size:13.5px;padding:10px 0;color:var(--label);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:#000}
.tabs button.on{color:#000;font-weight:600;border-bottom-color:var(--orange)}
.bk{margin-top:16px;max-width:640px;padding:20px 22px}
.bk h3{margin:0 0 4px;font-size:16px;font-weight:600}
.bk p{margin:0 0 14px;font-size:13px}
.steps{list-style:none;margin:0 0 18px;padding:0;display:flex;flex-direction:column;gap:8px;font-size:13px}
.steps li{display:flex;gap:10px;align-items:baseline}
.steps span{color:var(--orange);font-weight:700;font-variant-numeric:tabular-nums;width:12px}

/* ================= MAPEO ================= */
.mapv{flex:1;overflow-y:auto;background:var(--g25);min-height:0}
.mapv .page{max-width:1240px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:20px}
.kpi{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:14px 16px}
.kpi b{display:block;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:8px;line-height:1}
.kpi small{display:block;font-size:12px;color:var(--label);margin-top:6px}
.chk{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--g200);border-radius:8px;padding:12px 16px;margin-top:12px;font-size:13px;line-height:1.5}
.chk .pill{margin-left:0;flex-shrink:0;margin-top:1px}
.map-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 12px}
.map-tools .chips{margin-left:0}
.srch{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid var(--g200);border-radius:6px;background:#fff;color:var(--label);width:260px}
.srch input{border:0;outline:none;font:inherit;font-size:13px;flex:1;min-width:0;background:none;color:#000}
.map-tools .right{margin-left:auto;display:flex;gap:10px;align-items:center}
table.map{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--g200);border-radius:8px;overflow:hidden;font-size:13px}
table.map th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--label);padding:10px 12px;border-bottom:1px solid var(--g200);background:var(--g25);white-space:nowrap}
table.map td{padding:8px 12px;border-bottom:1px solid var(--g200);vertical-align:middle}
table.map tr:last-child td{border-bottom:0}
table.map tr:hover td{background:#FAFAFA}
table.map .n{color:var(--label);font-variant-numeric:tabular-nums;width:36px}
table.map .arr{width:24px;color:var(--g500);padding:8px 0}
.cg{display:block;font-size:11px;color:var(--label)}
.cl{display:block;color:#000}
.tabn{color:var(--label)}
.tp{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.tp-sin{color:var(--label);background:var(--g100)}
.tp-ren{color:#4F5638;background:#EEF0E7}
.tp-mov{color:var(--info);background:var(--infob)}
.tp-fus{color:var(--blue);background:#E2ECEC}
.tp-err{color:var(--neg);background:var(--negb)}
.nota{color:var(--g700);font-size:12.5px}
.see{border:0;background:none;color:var(--g700);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:2px;padding:0}
.see:hover{color:#000}
.extra td{background:var(--g25)}
.log{margin-top:32px}
.log h2{font-size:16px;font-weight:600;margin:0 0 12px}
.log-v{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:14px 18px;margin-bottom:10px}
.log-v header{display:flex;gap:10px;align-items:baseline;margin-bottom:8px}
.log-v header b{font-size:13.5px}
.log-v ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6;color:#1A1A1A}

/* ================= HOY ================= */
.sbA{width:300px;flex-shrink:0;background:#fff;border-right:1px solid #E6E6E6;display:flex;flex-direction:column;min-height:0;font-family:Arial,Helvetica,sans-serif}
.sbA-logo{height:64px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid #EEE}
.sbA-fixed{padding:8px 10px 0;position:relative;flex-shrink:0}
.aF{display:flex;align-items:center;gap:8px;height:50px;padding:0 14px;font-size:16px;color:#111;border-radius:8px;cursor:pointer;position:relative}
.aF:hover{background:#F6F6F6}
.aF.active,.aI.active{background:#F0F0F0;font-weight:700}
.aF.active::before,.aI.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--orange);border-radius:3px}
.sbA-scroll{flex:1;overflow-y:auto;padding:0 10px 10px;min-height:0}
.aG{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 14px;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.06em;color:#B5B5B5;text-transform:uppercase;cursor:pointer;border:2px solid transparent}
.aG > span{display:flex;align-items:center}
.aG .ic{color:#B5B5B5}
.aG.focus{border-color:#F6D2C9}
.aI{min-height:38px;display:flex;align-items:center;padding:6px 10px 6px 32px;font-size:15.5px;line-height:1.25;color:#111;cursor:pointer;border-radius:8px;position:relative}
.aI:hover{background:#F6F6F6}
.hl .aI.prov{background:var(--warnb);box-shadow:inset 3px 0 0 var(--warn)}
.sbA-foot{border-top:1px solid #EEE;position:relative;flex-shrink:0}
.avisos{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #EEE}
.avisos .lblA{margin:0}
.bellA{width:44px;height:36px;border:1px solid #DDD;border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;color:#333}
.bellA .bdg{position:absolute;top:-8px;right:-10px}
.userA{display:flex;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid #EEE}
.userA .sq{width:40px;height:40px;border-radius:6px;background:#0B3B3F;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.userA b{display:block;font-size:15px;font-weight:500}
.userA small{font-size:12.5px;color:#999}
.logoutA{padding:12px 20px;display:flex;gap:10px;font-size:15px;align-items:center;color:#222}
.verA{padding:0 20px 10px;font-size:11px;color:#B5B5B5;letter-spacing:.04em}
.mainA{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:#F9F9F9;font-family:Arial,Helvetica,sans-serif}
.hdA{height:64px;flex-shrink:0;background:#fff;border-bottom:1px solid #EEE;display:flex;align-items:center;gap:8px;padding:0 28px;font-size:17px;color:#999}
.hdA b{color:#111;font-weight:700}
.contentA{flex:1;overflow-y:auto;padding:36px 32px 48px;min-height:0}
.cardA{background:#fff;border:1px solid #E3E3E3;border-radius:10px;padding:20px 24px;position:relative;max-width:1100px}
.cardA h3{font-size:17px;font-weight:400;margin:0;color:#222}
.cardA p{font-size:14px;color:#555;margin:6px 0 12px}
.infoA{border-left:3px solid #2F80ED;background:#EAF3FC;padding:10px 14px;font-size:14px;color:#1F4F8F}
.lblA{font-size:13px;font-weight:700;color:#999;letter-spacing:.06em;text-transform:uppercase}
.pendA{display:flex;align-items:center;gap:14px;margin:6px 0 16px}
.chipA{border:1px solid #DDD;border-radius:8px;padding:8px 18px;background:#fff;font-size:15px;font-weight:600;display:flex;gap:10px;align-items:center}
.bdg{background:#E0442B;color:#fff;border-radius:11px;font-size:12px;font-weight:700;min-width:22px;height:22px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;font-style:normal}
.anA{font-size:19px;font-weight:700;color:#222;padding:22px 24px}
.resA{margin:26px 0 12px}
.resA span{text-transform:none;font-weight:400;letter-spacing:0}
.perA{display:flex;align-items:center;gap:10px;padding:14px 18px}
.pchip{border:1px solid #DDD;border-radius:9px;padding:6px 14px;font-size:15px;color:#222}
.pchip.on{border-color:var(--orange);color:var(--orange);background:#FDEEEA}
.genteA{margin-top:18px;background:#FBEBE7;border:1px solid #F1CFC6;border-left:3px solid var(--orange);border-radius:10px;padding:24px 28px;position:relative;max-width:1100px}
.gA-h{display:flex;gap:16px;align-items:center}
.gA-ic{width:48px;height:48px;border-radius:10px;background:#fff;border:1px solid #F1E1DC;display:flex;align-items:center;justify-content:center;color:#888}
.gA-t{font-size:26px;font-weight:700;color:#111}
.gA-s{font-size:15px;color:#777;margin-top:4px}
.gA-bar{height:7px;background:#7FA89D;border-radius:4px;margin:22px 0 14px}
.gA-o{font-size:14px;color:#888}

/* ---------- Notas ---------- */
.nt{padding:20px 22px 28px}
.nt h2{font-size:17px;font-weight:600;margin:4px 0 4px}
.nt > p{margin:0 0 16px}
.nt-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.nt-list li{display:flex;gap:12px;align-items:flex-start}
.nt-list b{font-size:13.5px;font-weight:600}
.nt-list .aj{font-size:11px;color:var(--label);border:1px solid var(--g300);border-radius:4px;padding:0 5px;margin-left:6px;white-space:nowrap;font-weight:400}
.nt-list p{font-size:12.5px;color:#3A3A3A;line-height:1.45;margin:3px 0 0}
.nt-list .btn-sec{margin-top:8px;height:28px;font-size:12px}
.nt-list.defs li{flex-direction:column;gap:4px}
.nt-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--g200);font-size:12px;color:var(--label);line-height:1.5}

/* ---------- Buscador ---------- */
.pal-ov{position:fixed;inset:0;background:rgba(0,0,0,.28);display:none;align-items:flex-start;justify-content:center;padding-top:12vh;z-index:50}
.pal-ov.show{display:flex}
.pal{width:580px;max-width:92vw;background:#fff;border:1px solid var(--g200);border-radius:10px;overflow:hidden}
.pal-in{display:flex;align-items:center;gap:10px;padding:0 14px;height:52px;border-bottom:1px solid var(--g200);color:var(--label)}
.pal-in input{flex:1;border:0;outline:none;font:inherit;font-size:15px;color:#000;background:none}
.pal-in kbd{font-family:var(--font);font-size:10.5px;border:1px solid var(--g300);border-radius:4px;padding:1px 5px;color:var(--label)}
#palres{list-style:none;margin:0;padding:6px;max-height:380px;overflow:auto}
#palres li[data-id]{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:6px;cursor:pointer}
#palres li.sel{background:var(--g100)}
#palres .pal-sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--label);padding:8px 10px 4px}
.r-l{font-size:13.5px;color:#000}
.r-was{display:block;font-size:11.5px;color:var(--label);margin-top:2px}
.r-p{font-size:12px;color:var(--label);margin-left:auto;white-space:nowrap}
.pal-empty{padding:18px 10px;color:var(--label);font-size:13px}
.pal-f{border-top:1px solid var(--g200);padding:8px 14px;font-size:11.5px;color:var(--label)}
</style>
</head>

<div class="tb">
  <div class="tb-brand">ESCALA ONE <small>· Maqueta de navegación v4</small></div>
  <div class="seg" id="modeSeg" role="tablist" aria-label="Vista">
    <button data-mode="act" role="tab">Hoy</button>
    <button data-mode="prop" role="tab">Propuesta (opción C)</button>
    <button data-mode="map" role="tab">Mapeo</button>

  <span class="spacer"></span>
  <button class="tgl" data-act="notes" id="notesBtn" aria-pressed="true"><span class="sw"></span>Notas</button>
</div>

<div class="stage">
  <div id="app"></div>
  <aside id="notes" aria-label="Notas"></aside>
</div>

function finishRow(r){
 if(r.to===undefined){r.t='Sin destino';r.ngl='—';r.nil='—';return r;}
 if(r.to===null){r.t='Movido';r.ngl=r.ng;r.nil=r.ni;return r;}
 const x=IDX[r.to];
 r.ngl=x.group?x.group.label:'Fijo, arriba del menú'; r.nil=x.item.label;
 if(r.tab){ r.t='Fusionado'; if(!(x.item.tabs||[]).includes(r.tab)) r.badTab=true; return r; }
 const eq=OGEQ[r.og], same=eq!==undefined&&((x.group?x.group.id:null)===eq);
 if(!same){ r.t='Movido'; if(!r.nota&&norm(r.ol)!==norm(x.item.label)) r.nota='Cambia de nombre'; }
 else r.t=norm(r.ol)===norm(x.item.label)?'Sin cambio':'Renombrado';
 return r;
}
function mkRow(og,ol){
 const d=DEST[og+'|'+ol]||{};
 let to=d.to;
 if(to===undefined){const m=SEARCH.find(s=>norm(s.label)===norm(ol)); to=m?m.id:undefined;}
 return finishRow({og,ol,to,tab:d.tab||null,nota:d.nota||'',ng:d.ng,ni:d.ni});
}

 <div class="pendA"><span class="lblA">Pendientes de autorizar</span><span class="chipA">Míos <i class="bdg">6</i></span><span class="chipA">Todos los pendientes</span></div>
 <div class="cardA anA">▸ Análisis (Admin)</div>
 <div class="lblA resA">Resumen operativo <span>(2 entidades a tu cargo)</span></div>
 <div class="cardA perA">${mk(8)}<span class="lblA">Periodo</span><span class="pchip on">Todos</span><span class="pchip">Dic 2026</span><span class="pchip">Oct 2026</span><span class="pchip">Sep 2026</span></div>
 <div class="genteA">${mk(9)}<div class="gA-h"><span class="gA-ic">${ic('users',22)}</span><div><div class="gA-t">Gente</div><div class="gA-s">3 módulos · 0 en el periodo</div></div></div><div class="gA-bar"></div><div class="gA-o">El más antiguo, 1d</div></div>
 <div class="cardA" style="margin-top:28px">${mk(7)}${backupAct()}</div>`;
}
function renderAct(){
 const groups=AG.map(([g,items])=>{
  const open=S.aOpen.has(g);
  const m=(g==='CATÁLOGOS'?mk(3,'inl'):'')+(g==='CONFIGURACIÓN'?mk(5,'inl'):'')+(S.aFocus===g?mk(2,'inl'):'');
  let h=`<div class="aG${S.aFocus===g?' focus':''}" data-ag="${g}" role="button" tabindex="0" aria-expanded="${open}"><span>${g}${m}</span>${ic(open?'down':'right',14)}</div>`;
  if(open) h+=items.map(x=>{const prov=x.endsWith('*'),l=prov?x.slice(0,-1):x;return `<div class="aI${prov?' prov':''}${S.aActive===l?' active':''}" data-ago="${esc(l)}" role="link" tabindex="0"><span>${esc(l)}</span>${(l==='Proveedores'&&g==='CATÁLOGOS')?mk(4,'inl'):''}</div>`;}).join('');
  return h;
 }).join('');
 return `<aside class="sbA" aria-label="Menú actual">
  <div class="sbA-logo">${logo()}</div>
  <div class="sbA-fixed">${mk(1,'tr')}${AF.map(l=>`<div class="aF${S.aActive===l?' active':''}" data-ago="${esc(l)}" role="link" tabindex="0">${l==='Ayuda'?ic('help',17):''}<span>${esc(l)}</span>${l==='Mi CV'?mk(6,'inl'):''}</div>`).join('')}</div>
  <nav class="sbA-scroll${S.hl?' hl':''}">${groups}</nav>
  <div class="sbA-foot">${mk(1,'tr')}
   <div class="avisos"><span class="lblA">Avisos</span><span class="bellA">${ic('bell',18)}<i class="bdg">9+</i></span></div>
   <div class="userA"><span class="sq">EH</span><div><b>Elsa María Huerta Salinas</b><small>Administración</small></div></div>
   <div class="logoutA">${ic('logout',17)}Cerrar sesión</div>
   <div class="verA">ESCALA ONE · v2026.05</div>
  </div>
 </aside>
 <div class="mainA"><header class="hdA">ESCALA ONE <span>›</span> <b>${esc(S.aActive)}</b></header><div class="contentA">${S.aActive==='Panel General'?dashAct():`<div class="cardA"><h3>${esc(S.aActive)}</h3><p>Pantalla del módulo.</p></div>`}</div></div>`;
}

/* ---------- Render: mapeo ---------- */
function mapRowHtml(r,i){
 const see=r.to===undefined?'':`<button class="see" data-see="${r.to===null?'panel':r.to}"${r.tab?` data-seetab="${esc(r.tab)}"`:''}>Ver</button>`;
 return `<tr class="${r.extra?'extra':''}"><td class="n">${r.extra?'—':i}</td>
 <td><span class="cg">${esc(r.og)}</span><span class="cl">${esc(r.ol)}</span></td>
 <td class="arr">${ic('arrow',14)}</td>
 <td><span class="cg">${esc(r.ngl)}</span><span class="cl">${esc(r.nil)}${r.tab?` <span class="tabn">› ${esc(r.tab)}</span>`:''}</span></td>
 <td><span class="tp tp-${TCLS[r.t]}">${r.t}</span>${r.badTab?' <span class="tp tp-err">Pestaña no existe</span>':''}</td>
 <td class="nota">${esc(r.nota||'')}</td>
 <td>${see}</td></tr>`;
}
function mapVisible(){
 const q=norm(S.mapQ.trim());
 const rows=MAP.map((r,i)=>({r,i:i+1})).concat(EXTRA.map(r=>({r,i:0})));
 return rows.filter(({r})=>(S.mapF==='Todos'||r.t===S.mapF)&&(!q||norm([r.og,r.ol,r.ngl,r.nil,r.tab||'',r.t,r.nota].join(' ')).includes(q)));
}
function drawMapRows(){
 const vis=mapVisible();
 const tb=document.getElementById('maprows'); if(!tb) return;
 tb.innerHTML=vis.length?vis.map(({r,i})=>mapRowHtml(r,i)).join(''):`<tr><td colspan="7" class="muted" style="padding:18px 12px">Sin resultados.</td></tr>`;
 document.getElementById('mapcount').textContent=`${vis.length} ${vis.length===1?'renglón':'renglones'}`;
}
function renderMap(){
 const I=integrity();
 const counts={}; MAP.forEach(r=>counts[r.t]=(counts[r.t]||0)+1);
 const ok=!I.sinDestino.length&&!I.badTabs.length&&!I.sinOrigen.length;
 const issues=[];
 if(I.sinDestino.length) issues.push(`Sin destino: ${I.sinDestino.map(r=>esc(r.og+' › '+r.ol)).join(', ')}.`);
 if(I.badTabs.length) issues.push(`Pestañas que no existen: ${I.badTabs.map(r=>esc(r.ol+' → '+r.tab)).join(', ')}.`);
 if(I.sinOrigen.length) issues.push(`Entradas de la propuesta sin origen: ${I.sinOrigen.map(id=>esc(IDX[id].item.label)).join(', ')}.`);
 const kpi=(lbl,val,sub)=>`<div class="kpi"><span class="eyebrow">${lbl}</span><b>${val}</b><small>${sub}</small></div>`;
 return `<section class="mapv"><div class="page">
  <div class="page-h"><span class="eyebrow">Control</span><h1>Mapeo: menú actual contra propuesta</h1><p class="muted">Maqueta v4 · 18 nov 2026 · Cada entrada del menú actual y dónde queda en la propuesta.</p></div>
  <div class="kpis">
   ${kpi('Menú actual',I.total,'entradas en 9 grupos y el bloque fijo')}
   ${kpi('Propuesta',I.prop,'entradas en 9 grupos y Panel general')}
   ${TIPOS.map(t=>kpi(t,counts[t]||0,{'Sin cambio':'mismo grupo y nombre','Renombrado':'mismo grupo, otro nombre','Movido':'otro grupo','Fusionado':'queda como pestaña'}[t])).join('')}
  </div>
  <div class="chk">${ok?'<span class="pill pos">Cuadra</span>':'<span class="pill neg">Revisar</span>'}<span>${ok?`${I.total} de ${I.total} entradas actuales tienen destino. ${I.prop} de ${I.prop} entradas de la propuesta tienen origen. Todas las pestañas indicadas existen.`:issues.join(' ')}</span></div>
  <div class="map-tools">
   <label class="srch">${ic('search',14)}<input id="mapq" placeholder="Buscar en el mapeo" value="${esc(S.mapQ)}" aria-label="Buscar en el mapeo"></label>
   <div class="chips">${['Todos',...TIPOS].map(t=>`<button class="chip${S.mapF===t?' on':''}" data-mapf="${t}">${t} ${t==='Todos'?I.total+EXTRA.length:(counts[t]||0)}</button>`).join('')}</div>
   <div class="right"><span class="muted sm" id="mapcount"></span><button class="btn-sec" data-act="csv">${ic('download',14)}Descargar CSV</button></div>
  </div>
  <table class="map"><thead><tr><th>#</th><th>Menú actual</th><th></th><th>Propuesta</th><th>Cambio</th><th>Nota</th><th></th></tr></thead><tbody id="maprows"></tbody></table>
  <section class="log"><h2>Bitácora de ajustes</h2>${LOG.map(l=>`<article class="log-v"><header><b>${l.v}</b><span class="muted sm">${l.f}</span></header><ul>${l.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></article>`).join('')}</section>
 </div></section>`;
}
function downloadCsv(){
 const head=['No.','Grupo actual','Entrada actual','Grupo propuesto','Entrada propuesta','Pestaña','Cambio','Nota'];
 const rows=MAP.map((r,i)=>[i+1,r.og,r.ol,r.ngl,r.nil,r.tab||'',r.t,r.nota]).concat(EXTRA.map(r=>['',r.og,r.ol,r.ngl,r.nil,r.tab||'',r.t,r.nota]));
 const s=[head,...rows].map(a=>a.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
 const blob=new Blob(['﻿'+s],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='escala-one-mapeo-menu-v4.csv';
 document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- Notas ---------- */
function renderNotes(){
 if(S.mode==='map'){
  const defs=[['Sin cambio','Mismo grupo y mismo nombre. Puede cambiar solo mayúsculas y minúsculas.'],['Renombrado','Mismo grupo, otro nombre.'],['Movido','Pasa a otro grupo. Si también cambia de nombre, lo dice la nota.'],['Fusionado','Se une con otras pantallas y queda como pestaña.']];
  return `<div class="nt"><span class="eyebrow">Cómo leer el mapeo</span><h2>Control del mapeo</h2><p class="muted sm">Cada renglón es una entrada del menú actual.</p>
  <ol class="nt-list defs">${defs.map(([t,d])=>`<li><span class="tp tp-${TCLS[t]}">${t}</span><p>${d}</p></li>`).join('')}</ol>
  <p class="nt-foot">La tabla se genera de los mismos datos que dibujan las vistas Hoy y Propuesta, así que cualquier ajuste se refleja aquí y el control de integridad avisa si algo queda sin destino. “Ver” abre la entrada en la propuesta.</p></div>`;
 }
 const N=NOTES[S.mode];
 return `<div class="nt"><span class="eyebrow">${S.mode==='act'?'Diagnóstico':'Qué cambia'}</span><h2>${N.title}</h2><p class="muted sm">${N.sub}</p>
 <ol class="nt-list">${N.items.map(n=>`<li><span class="mk st">${n.n}</span><div><b>${n.t}</b>${n.aj?`<span class="aj">${typeof n.aj==='number'?'Ajuste '+n.aj:n.aj}</span>`:''}<p>${n.d}</p>${n.hl?`<button class="btn-sec" data-act="hl">${S.hl?'Quitar resaltado':'Resaltar en el menú'}</button>`:''}${n.pal?`<button class="btn-sec" data-act="palette">Abrir buscador</button>`:''}</div></li>`).join('')}</ol>
 <p class="nt-foot">${N.foot}</p></div>`;
}

/* ---------- Render general ---------- */
const app=document.getElementById('app');
function render(){
 const sc=app.querySelector('.sb-scroll,.sbA-scroll,.mapv'), st=sc?sc.scrollTop:0, same=app.dataset.mode===S.mode;
 app.innerHTML=S.mode==='prop'?renderProp():S.mode==='act'?renderAct():renderMap();
 app.dataset.mode=S.mode;
 if(S.mode==='map') drawMapRows();
 if(same){const s2=app.querySelector('.sb-scroll,.sbA-scroll,.mapv'); if(s2) s2.scrollTop=st;}
 document.getElementById('notes').innerHTML=renderNotes();
 document.body.classList.toggle('notes-off',!S.notes);
 document.querySelectorAll('#modeSeg button').forEach(b=>{const on=b.dataset.mode===S.mode;b.classList.toggle('on',on);b.setAttribute('aria-selected',on);});
 const nb=document.getElementById('notesBtn'); nb.classList.toggle('on',S.notes); nb.setAttribute('aria-pressed',S.notes);
}
function go(id,tab){
 S.mode='prop'; S.active=id; const x=IDX[id];
 if(tab) S.tab[id]=tab;
 S.open=new Set(x&&x.group?[x.group.id]:[]);
 S.recent=[id,...S.recent.filter(r=>r!==id)].slice(0,6);
 S.userMenu=false; render();
 requestAnimationFrame(()=>{const a=app.querySelector('.g .it.active'); if(a) a.scrollIntoView({block:'nearest'}); const c=app.querySelector('.content'); if(c) c.scrollTop=0;});
}

/* ---------- Eventos ---------- */
document.addEventListener('click',e=>{
 if(e.target.closest('.pal-ov')) return;
 let rerender=false;
 if(S.userMenu&&!e.target.closest('.menu')&&!e.target.closest('[data-act="user"]')){S.userMenu=false;rerender=true;}
 const t=e.target.closest('[data-mode],[data-act],[data-go],[data-g],[data-pend],[data-period],[data-tab],[data-ag],[data-ago],[data-mapf],[data-see]');
 if(!t){if(rerender)render();return;}
 e.preventDefault();
 const d=t.dataset;
 if(d.mode){S.mode=d.mode;S.userMenu=false;render();return;}
 if(d.act){
  switch(d.act){
   case 'palette': openPal(); break;
   case 'rail': S.rail=!S.rail; render(); break;
   case 'user': S.userMenu=!S.userMenu; render(); break;
   case 'analysis': S.analysis=!S.analysis; render(); break;
   case 'notes': S.notes=!S.notes; render(); break;
   case 'hl': S.hl=!S.hl; render(); break;
   case 'csv': downloadCsv(); break;
   default: S.userMenu=false; render();
  }
  return;
 }
 if(d.see){go(d.see,d.seetab);return;}
 if(d.go){go(d.go);return;}
 if(d.g){
  if(S.rail){S.rail=false;S.open.add(d.g);}
  else S.open.has(d.g)?S.open.delete(d.g):S.open.add(d.g);
  render();return;
 }
 if(d.pend){S.pend=d.pend;render();return;}
 if(d.period){S.period=d.period;render();return;}
 if(d.tab){S.tab[S.active]=d.tab;render();return;}
 if(d.mapf){S.mapF=d.mapf;render();return;}
 if(d.ag){S.aOpen.has(d.ag)?S.aOpen.delete(d.ag):S.aOpen.add(d.ag);S.aFocus=d.ag;render();return;}
 if(d.ago){S.aActive=d.ago;render();return;}
});
document.addEventListener('input',e=>{ if(e.target.id==='mapq'){S.mapQ=e.target.value;drawMapRows();} });

/* ---------- Buscador ---------- */
const ov=document.getElementById('palov'), q=document.getElementById('palq'), res=document.getElementById('palres');
let palOpen=false, palSel=0, palItems=[];
function openPal(){
 if(S.mode!=='prop'){S.mode='prop';render();}
 S.userMenu=false;
 ov.classList.add('show'); palOpen=true; q.value=''; palSearch(); setTimeout(()=>q.focus(),0);
}
function closePal(){ov.classList.remove('show');palOpen=false;}
function palSearch(){
 const raw=q.value.trim(), n=norm(raw); let head='';
 if(!n){
  head='Recientes';
  palItems=S.recent.map(id=>({x:SEARCH.find(s=>s.id===id),hit:null})).filter(r=>r.x);
 }else{
  palItems=SEARCH.map(x=>{
   const L=norm(x.label); let s=0, hit=null;
   if(L.startsWith(n)) s=4; else if(L.includes(n)) s=3; else if(norm(x.path).includes(n)) s=1;
   const w=x.was.find(v=>norm(v).includes(n));
   if(w&&s<3){s=Math.max(s,2);hit=w;}
   return {x,s,hit};
  }).filter(r=>r.s>0).sort((a,b)=>b.s-a.s||a.x.label.localeCompare(b.x.label,'es')).slice(0,12);
 }
 palSel=0;
 res.innerHTML=palItems.length
  ?(head?`<li class="pal-sec">${head}</li>`:'')+palItems.map((r,i)=>`<li data-id="${r.x.id}" class="${i===0?'sel':''}" role="option"><div><span class="r-l">${esc(r.x.label)}</span>${r.hit?`<span class="r-was">Antes: ${esc(r.hit)}</span>`:''}</div><span class="r-p">${esc(r.x.path)}</span></li>`).join('')
  :`<li class="pal-empty">Sin resultados para “${esc(raw)}”.</li>`;
}
function palMark(){
 res.querySelectorAll('li[data-id]').forEach((li,i)=>{li.classList.toggle('sel',i===palSel);if(i===palSel)li.scrollIntoView({block:'nearest'});});
}
q.addEventListener('input',palSearch);
q.addEventListener('keydown',e=>{
 if(e.key==='ArrowDown'){e.preventDefault();palSel=Math.min(palSel+1,palItems.length-1);palMark();}
 else if(e.key==='ArrowUp'){e.preventDefault();palSel=Math.max(palSel-1,0);palMark();}
 else if(e.key==='Enter'){e.preventDefault();const r=palItems[palSel];if(r){closePal();go(r.x.id);}}
});
ov.addEventListener('click',e=>{
 const li=e.target.closest('li[data-id]');
 if(li){closePal();go(li.dataset.id);return;}
 if(!e.target.closest('.pal')) closePal();
});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();palOpen?closePal():openPal();return;}
 if(e.key==='Escape'){ if(palOpen) closePal(); else if(S.userMenu){S.userMenu=false;render();} return; }
 if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('[data-ag],[data-ago]')){e.preventDefault();e.target.click();}
});

render();
</script>
</body>
</html>
